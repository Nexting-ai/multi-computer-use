<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="282" viewBox="0 0 1100 282" role="img" aria-labelledby="title description">
  <title id="title">Measured results: less time and fewer tokens</title>
  <desc id="description">On a real four-desktop Odoo workflow, one agent completed all four companies in 70.9 percent less time and with 58.4 percent fewer tokens. In a separate 100-desktop back-office experiment, token use fell by 98.9 percent, about 90 times less, with equal wall time.</desc>
  <rect width="1100" height="282" rx="12" fill="#ffffff"/>
  <text x="32" y="36" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="650">Real applications. Same model. Measured side by side.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="32" y="58" width="336" height="184" rx="10" fill="#fff5f5" stroke="#ffd7d5"/>
    <text x="52" y="84" fill="#59636e" font-size="14" font-weight="600">ODOO ORDER-TO-CASH · 4 DESKTOPS</text>
    <text x="52" y="133" fill="#d1242f" font-size="46" font-weight="750">70.9%</text>
    <text x="52" y="158" fill="#d1242f" font-size="17" font-weight="700">LESS TIME · 3.44× FASTER</text>
    <text x="52" y="190" fill="#1f2328" font-size="20" font-weight="600">19:04 → 5:32</text>
    <text x="52" y="221" fill="#59636e" font-size="13">Both arms: 4/4 companies · 0 wrong records</text>

    <rect x="382" y="58" width="336" height="184" rx="10" fill="#fff5f5" stroke="#ffd7d5"/>
    <text x="402" y="84" fill="#59636e" font-size="14" font-weight="600">SAME ODOO RUN</text>
    <text x="402" y="133" fill="#d1242f" font-size="46" font-weight="750">58.4%</text>
    <text x="402" y="158" fill="#d1242f" font-size="17" font-weight="700">FEWER TOKENS</text>
    <text x="402" y="190" fill="#1f2328" font-size="20" font-weight="600">6.03M → 2.51M</text>
    <text x="402" y="221" fill="#59636e" font-size="13">60.3% fewer tool calls · 189 → 75</text>

    <rect x="732" y="58" width="336" height="184" rx="10" fill="#fff5f5" stroke="#ffd7d5"/>
    <text x="752" y="84" fill="#59636e" font-size="14" font-weight="600">BACK OFFICE · 100 DESKTOPS</text>
    <text x="752" y="133" fill="#d1242f" font-size="46" font-weight="750">98.9%</text>
    <text x="752" y="158" fill="#d1242f" font-size="17" font-weight="700">FEWER TOKENS · ~90×</text>
    <text x="752" y="190" fill="#1f2328" font-size="20" font-weight="600">15.17M → 0.17M</text>
    <text x="752" y="221" fill="#59636e" font-size="13">Same 312 s · 900/900 vs 896/900</text>
  </g>
  <text x="32" y="269" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Different workloads. Tokens include cached input. Exact data and limits linked below.</text>
</svg>
