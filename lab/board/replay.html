<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>共享白板回放</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0f19;color:#e6e9f2;font:14px -apple-system,"PingFang SC","Segoe UI",sans-serif}
#top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #1d2436}
#top h1{font-size:16px;margin:0;font-weight:650}#top .sp{flex:1}
#ctl button{background:#1a2133;color:#e6e9f2;border:1px solid #2a3350;border-radius:8px;padding:5px 11px;margin-left:6px;cursor:pointer}
#ctl input{width:240px;vertical-align:middle}
#clock{font:600 13px ui-monospace,Menlo,monospace;color:#9aa4bd;min-width:64px;text-align:right}
#panels{display:flex;gap:14px;padding:14px 20px;justify-content:center}
.panel{background:#121827;border:1px solid #1f2740;border-radius:14px;padding:12px;flex:1;max-width:820px}
.panel h2{margin:0 0 8px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stat{background:#0e1422;border:1px solid #1f2740;border-radius:9px;padding:5px 9px}.stat i{display:block;font-style:normal;font-size:11px;color:#7f89a3}.stat b{font:650 17px ui-monospace,Menlo,monospace}
iframe{width:100%;border:0;border-radius:8px;background:#fff;display:block}
.bar{height:5px;border-radius:3px;background:#1d2436;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa);width:0}
.done{color:#4ade80}
</style>
</head>
<body>
<div id="top"><h1>同一块白板，多只手 · 真实 Excalidraw</h1><span class="sp"></span><div id="ctl"></div><div id="clock">0:00</div></div>
<div id="panels"></div>
<script>
const q = new URLSearchParams(location.search);
const logs = q.getAll("log");
const FIT = q.get("fit") || "250,110,1270,720";
let speed = Number(q.get("speed") ?? 4), playing = true, t = 0, last = performance.now();
const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const tok = (n) => (n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n || 0));
const ctl = document.getElementById("ctl");
ctl.innerHTML = '<button id=pp>暂停</button><button data-s=1>1×</button><button data-s=4>4×</button><button data-s=16>16×</button><input id=sk type=range min=0 max=1000 value=0>';
Promise.all(logs.map((l) => fetch("/log?path=" + encodeURIComponent(l)).then((r) => r.text()))).then(async (texts) => {
  const h = logs.length >= 3 ? 330 : logs.length === 2 ? 470 : 640;
  const runs = await Promise.all(texts.map((x) => new Promise((ready) => {
    const ev = x.trim().split("\n").map((l) => JSON.parse(l));
    const el = document.createElement("div"); el.className = "panel";
    el.innerHTML = '<h2></h2><div class="stats"><div class="stat"><i>完成度</i><b class="m">0%</b></div><div class="stat"><i>用时</i><b class="t">0:00</b></div><div class="stat"><i>决策次数</i><b class="d">0</b></div><div class="stat"><i>Token</i><b class="k">0</b></div></div><iframe style="height:' + h + 'px"></iframe><div class="bar"><i></i></div>';
    el.querySelector("h2").textContent = ev[0].title;
    document.getElementById("panels").append(el);
    const f = el.querySelector("iframe");
    const run = { ev, i: 1, el, f, end: ev[ev.length - 1].t, pointers: new Map(), meta: {}, ended: null };
    for (let n = 1; n <= ev[0].cursors; n++) run.pointers.set(n, { n, x: 0, y: 0, button: "up", label: "C" + n });
    f.onload = () => { const wait = () => (f.contentWindow.__apply ? ready(run) : setTimeout(wait, 100)); wait(); };
    f.src = "/view?view=1&replay=1&fit=" + FIT;
  })));
  const total = Math.max(...runs.map((r) => r.end));
  function step(r) {
    const els = []; let moved = false;
    while (r.i < r.ev.length && r.ev[r.i].t <= t) {
      const e = r.ev[r.i++];
      if (e.type === "elements") els.push(...e.elements);
      else if (e.type === "pointer") { Object.assign(r.pointers.get(e.n), { x: e.x, y: e.y, button: e.button }); moved = true; }
      else if (e.type === "label") { r.pointers.get(e.n).label = e.label; moved = true; }
      else if (e.type === "meta") Object.assign(r.meta, e);
      else if (e.type === "end") { r.ended = e.t; r.el.querySelector(".t").classList.add("done"); }
    }
    const w = r.f.contentWindow;
    if (els.length) w.__apply({ type: "elements", elements: els });
    if (moved) w.__apply({ type: "pointers", pointers: [...r.pointers.values()].filter((p) => p.x || p.y) });
    const s = r.meta.score || 0;
    r.el.querySelector(".m").textContent = (s * 100).toFixed(0) + "%";
    r.el.querySelector(".bar i").style.width = s * 100 + "%";
    r.el.querySelector(".t").textContent = fmt(r.ended ?? Math.min(t, r.end));
    r.el.querySelector(".d").textContent = r.meta.decisions || 0;
    r.el.querySelector(".k").textContent = tok(r.meta.tokens);
  }
  const sk = document.getElementById("sk");
  document.getElementById("pp").onclick = (e) => { playing = !playing; e.target.textContent = playing ? "暂停" : "播放"; };
  ctl.querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => (speed = Number(b.dataset.s))));
  sk.oninput = () => { const to = (total * sk.value) / 1000; if (to < t) location.reload(); t = to; };
  window.__replay = { total, pause: () => (playing = false), setSpeed: (s) => (speed = s), get t() { return t; }, advance: (x) => { playing = false; t = x; runs.forEach(step); document.getElementById("clock").textContent = fmt(t); } };
  (function tick(now) {
    const dt = now - last; last = now;
    if (playing) { t = Math.min(total, t + dt * speed); sk.value = Math.round((1000 * t) / total); }
    runs.forEach(step);
    document.getElementById("clock").textContent = fmt(t);
    requestAnimationFrame(tick);
  })(performance.now());
});
</script>
</body>
</html>
