<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>多光标实况墙</title>
    <style>
      :root {
        --bg: #06080c;
        --panel: rgba(255, 255, 255, 0.025);
        --line: rgba(255, 255, 255, 0.07);
        --text: #e9eef7;
        --dim: #8a94a8;
        --faint: #566074;
        --ok: #2bd67b;
        --live: #ff4d5e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.35 -apple-system,
          "SF Pro Text",
          "PingFang SC",
          "Helvetica Neue",
          Arial,
          sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            1200px 600px at 15% -10%,
            rgba(63, 210, 255, 0.08),
            transparent 60%
          ),
          radial-gradient(
            1000px 600px at 95% 110%,
            rgba(182, 125, 255, 0.07),
            transparent 60%
          );
      }
      .top {
        position: relative;
        height: 54px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 650;
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .brand i {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: conic-gradient(
          from 200deg,
          #3fd2ff,
          #b67dff,
          #ff5c8a,
          #3fd2ff
        );
        box-shadow: 0 0 18px rgba(63, 210, 255, 0.35);
      }
      .src {
        color: var(--faint);
        font:
          11px/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        flex: 1;
      }
      .mode {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 11px;
        border-radius: 99px;
        border: 1px solid var(--line);
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--dim);
        font-weight: 600;
      }
      .mode b {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--live);
        box-shadow: 0 0 10px var(--live);
        animation: pulse 1.6s infinite;
      }
      .mode.replay b {
        background: #b67dff;
        box-shadow: 0 0 10px #b67dff;
      }
      .mode.off b {
        animation: none;
        background: var(--faint);
        box-shadow: none;
      }
      .clock {
        font:
          600 13px/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: var(--dim);
        min-width: 70px;
        text-align: right;
      }
      button.ctl {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      #panels {
        position: relative;
        display: flex;
        gap: 16px;
        padding: 16px;
        height: calc(100vh - 54px);
      }
      .empty {
        margin: auto;
        text-align: center;
        color: var(--dim);
      }
      .empty h1 {
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
        margin: 0 0 8px;
      }
      .panel {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.99);
        }
      }
      .head {
        padding: 16px 18px 12px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.03),
          transparent
        );
      }
      .row1 {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .arm {
        font:
          700 11px/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        padding: 5px 7px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--dim);
        letter-spacing: 0.04em;
      }
      .title {
        font-size: 20px;
        font-weight: 680;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .state {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--dim);
        white-space: nowrap;
      }
      .state b {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 10px var(--ok);
        animation: pulse 1.6s infinite;
      }
      .panel.finished .state b {
        background: var(--faint);
        box-shadow: none;
        animation: none;
      }
      .sub {
        margin-top: 5px;
        color: var(--dim);
        font-size: 12px;
      }
      .stats {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .stat {
        flex: 1;
        min-width: 0;
        padding: 8px 11px 9px;
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .stat .k {
        font-size: 10.5px;
        color: var(--faint);
        letter-spacing: 0.06em;
      }
      .stat .v {
        margin-top: 3px;
        font:
          650 20px/1.1 -apple-system,
          "SF Pro Display",
          "PingFang SC",
          sans-serif;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .stat .v small {
        font-size: 12px;
        color: var(--dim);
        font-weight: 500;
      }
      .stat .bar {
        margin-top: 6px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }
      .stat .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ok);
        transition: width 0.5s;
      }
      .dots {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 10px;
        min-height: 8px;
        align-items: center;
      }
      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        opacity: 0.3;
        transition:
          opacity 0.4s,
          box-shadow 0.4s;
      }
      .dots span.on {
        opacity: 1;
      }
      .dots em {
        font-style: normal;
        font-size: 10.5px;
        color: var(--faint);
        margin-right: 4px;
      }
      .grid {
        position: relative;
        flex: 1;
        min-height: 0;
        margin: 12px;
      }
      .tile {
        position: absolute;
        border-radius: 9px;
        overflow: hidden;
        background: #0f131b;
        border: 1px solid rgba(255, 255, 255, 0.07);
        transition: box-shadow 0.5s;
      }
      .tile img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .tile .ph {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--faint);
        font-size: 11px;
      }
      .tile .name {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 14px 8px 5px;
        background: linear-gradient(0deg, rgba(5, 7, 11, 0.88), transparent);
        font-size: var(--fs, 11px);
        color: #dfe5ef;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      .tile .name u {
        text-decoration: none;
        color: var(--dim);
        font:
          600 0.9em ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        margin-right: 5px;
      }
      .tile .ok {
        position: absolute;
        top: 6px;
        right: 6px;
        display: none;
        align-items: center;
        gap: 4px;
        padding: 2px 7px 2px 5px;
        border-radius: 99px;
        background: var(--ok);
        color: #04140b;
        font-size: var(--fs, 11px);
        font-weight: 700;
        box-shadow: 0 2px 10px rgba(43, 214, 123, 0.45);
      }
      .tile.done .ok {
        display: flex;
        animation: pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      .tile.done {
        border-color: rgba(43, 214, 123, 0.55);
      }
      .tile.done::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(43, 214, 123, 0.07);
        pointer-events: none;
      }
      @keyframes pop {
        from {
          transform: scale(0.3);
          opacity: 0;
        }
      }
      .cur {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 5;
        pointer-events: none;
        transition:
          left 0.34s cubic-bezier(0.22, 0.9, 0.3, 1),
          top 0.34s cubic-bezier(0.22, 0.9, 0.3, 1),
          opacity 0.6s;
        opacity: 0;
      }
      .cur.on {
        opacity: 1;
      }
      .cur svg {
        position: absolute;
        left: -2px;
        top: -1px;
        width: var(--cs, 18px);
        height: var(--cs, 18px);
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.6))
          drop-shadow(0 0 6px var(--c));
        transition: transform 0.12s;
      }
      .cur.press svg {
        transform: scale(0.82);
      }
      .cur .tag {
        position: absolute;
        left: calc(var(--cs, 18px) * 0.75);
        top: calc(var(--cs, 18px) * 0.8);
        padding: 1px 6px;
        border-radius: 99px;
        background: var(--c);
        color: #070a10;
        font-size: var(--fs, 11px);
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      }
      .cur .bubble {
        position: absolute;
        left: calc(var(--cs, 18px) * 0.75);
        bottom: calc(var(--cs, 18px) * 0.2);
        padding: 2px 7px;
        border-radius: 7px;
        background: rgba(8, 11, 17, 0.92);
        border: 1px solid var(--c);
        color: #f1f5fb;
        font:
          600 var(--fs, 11px) ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        white-space: nowrap;
        max-width: 11em;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .cur .bubble.show {
        opacity: 1;
        transform: none;
      }
      .cur.flip .tag,
      .cur.flip .bubble {
        left: auto;
        right: calc(var(--cs, 18px) * 0.15);
      }
      .ripple {
        position: absolute;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        border: 2px solid var(--c);
        box-shadow: 0 0 12px var(--c);
        pointer-events: none;
        z-index: 4;
        animation: ripple 0.65s ease-out forwards;
      }
      @keyframes ripple {
        from {
          transform: scale(0.2);
          opacity: 1;
        }
        to {
          transform: scale(2.2);
          opacity: 0;
        }
      }
      .vs {
        align-self: center;
        flex: 0 0 auto;
        width: 0;
        position: relative;
      }
      .vs span {
        position: absolute;
        left: -17px;
        top: -17px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #0c1017;
        border: 1px solid var(--line);
        color: var(--dim);
        font:
          700 11px/1 ui-monospace,
          Menlo,
          monospace;
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="brand"><i></i>多光标实况墙</div>
      <div class="src" id="src"></div>
      <span id="ctl"></span>
      <div class="mode" id="mode"><b></b><span>LIVE</span></div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
    <div id="panels">
      <div class="empty" id="empty">
        <h1>等待实验开始</h1>
        <div>一旦某个实验臂写出 wall.json，这里会自动出现它的全部窗口。</div>
      </div>
    </div>
    <script>
      const qs = new URLSearchParams(location.search);
      const REPLAY = qs.get("replay");
      const SPEED = Math.max(0.1, Number(qs.get("speed") || 4));
      const ORDER = ["F", "D", "S", "P-T"];
      const $ = (s, el = document) => el.querySelector(s);
      const h = (tag, cls, html) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html !== undefined) e.innerHTML = html;
        return e;
      };
      const ARROW =
        '<svg viewBox="0 0 24 24"><path d="M3 2.2 L3 19.6 L7.6 15.3 L10.6 22 L13.7 20.6 L10.8 14 L17.2 14 Z" fill="var(--c)" stroke="#05070b" stroke-width="1.4" stroke-linejoin="round"/></svg>';

      // Clock: live = wall time; replay = virtual time.
      let offset = 0;
      let vclock = null;
      const now = () => (vclock ? vclock() : Date.now() + offset);

      const panels = new Map();

      function fmtDur(ms) {
        if (!(ms >= 0)) return "0:00";
        const s = Math.floor(ms / 1000);
        const m = Math.floor(s / 60);
        const hh = Math.floor(m / 60);
        const pad = (n) => String(n).padStart(2, "0");
        return hh
          ? `${hh}:${pad(m % 60)}:${pad(s % 60)}`
          : `${m}:${pad(s % 60)}`;
      }
      function fmtTok(n) {
        if (!n) return "—";
        if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(0) + "k";
        return String(n);
      }

      function insertPanel(p) {
        $("#empty")?.remove();
        const host = $("#panels");
        const rank = (x) => {
          const r = ORDER.indexOf(x.arm);
          return r < 0 ? 99 : r;
        };
        const sorted = [...panels.values()].sort(
          (a, b) => rank(a) - rank(b) || a.id.localeCompare(b.id),
        );
        host.innerHTML = "";
        sorted.forEach((x, i) => {
          if (i) {
            const vs = h("div", "vs", "<span>VS</span>");
            host.append(vs);
          }
          host.append(x.el);
        });
        layoutAll();
      }

      function makePanel(ev) {
        const el = h("section", "panel");
        el.innerHTML = `
          <div class="head">
            <div class="row1"><span class="arm"></span><div class="title"></div>
              <div class="state"><b></b><span>进行中</span></div></div>
            <div class="sub"></div>
            <div class="stats">
              <div class="stat"><div class="k">活跃 AGENT</div><div class="v" data-k="active">0</div></div>
              <div class="stat"><div class="k">完成窗口</div><div class="v" data-k="done">0</div><div class="bar"><i></i></div></div>
              <div class="stat"><div class="k">用时</div><div class="v" data-k="time">0:00</div></div>
              <div class="stat"><div class="k">TOKEN</div><div class="v" data-k="tok">—</div></div>
            </div>
            <div class="dots"></div>
          </div>
          <div class="grid"></div>`;
        const p = {
          id: ev.panel,
          arm: ev.arm,
          el,
          grid: $(".grid", el),
          view: ev.view,
          started: ev.started,
          finished: ev.finished,
          tiles: new Map(),
          owners: new Map(Object.entries(ev.owners || {})),
          seen: new Map(), // actor id -> last action time
          actors: new Map(), // actor id -> actor
          done: new Map(),
          tokens: 0,
        };
        $(".arm", el).textContent = ev.arm;
        $(".title", el).textContent = ev.title;
        $(".sub", el).textContent = ev.subtitle;
        for (const s of ev.surfaces) {
          const t = h("div", "tile");
          t.innerHTML = `<div class="ph">等待画面…</div><img alt="" style="display:none"><div class="ok">✓ 完成</div><div class="name"><u>${s.id}</u></div><div class="cur">${ARROW}<span class="bubble"></span><span class="tag"></span></div>`;
          $(".name", t).append(document.createTextNode(s.company));
          p.grid.append(t);
          p.tiles.set(s.id, {
            el: t,
            img: $("img", t),
            cur: $(".cur", t),
            tag: $(".tag", t),
            bubble: $(".bubble", t),
            queue: [],
            busy: false,
            x: ev.view.width / 2,
            y: ev.view.height / 2,
            loading: false,
            next: null,
            vw: ev.view.width,
            vh: ev.view.height,
          });
        }
        for (const [sid, a] of p.owners) setOwner(p, sid, a, false);
        panels.set(p.id, p);
        if (p.finished) markFinished(p, p.finished);
        insertPanel(p);
        new ResizeObserver(() => layout(p)).observe(p.grid);
        return p;
      }

      function layout(p) {
        const W = p.grid.clientWidth,
          H = p.grid.clientHeight,
          n = p.tiles.size,
          g = n > 24 ? 5 : 8,
          a = p.view.width / p.view.height;
        if (!W || !H || !n) return;
        let best = { w: 0, cols: 1, rows: 1 };
        for (let cols = 1; cols <= n; cols++) {
          const rows = Math.ceil(n / cols);
          const w = Math.min(
            (W - (cols - 1) * g) / cols,
            ((H - (rows - 1) * g) / rows) * a,
          );
          if (w > best.w) best = { w, cols, rows };
        }
        const tw = Math.floor(best.w),
          th = Math.floor(tw / a);
        const gw = best.cols * tw + (best.cols - 1) * g,
          gh = best.rows * th + (best.rows - 1) * g;
        const x0 = (W - gw) / 2,
          y0 = (H - gh) / 2;
        p.grid.style.setProperty(
          "--cs",
          Math.max(11, Math.min(22, tw / 13)) + "px",
        );
        p.grid.style.setProperty(
          "--fs",
          Math.max(8, Math.min(11.5, tw / 22)) + "px",
        );
        [...p.tiles.values()].forEach((t, i) => {
          const c = i % best.cols,
            r = Math.floor(i / best.cols);
          Object.assign(t.el.style, {
            left: x0 + c * (tw + g) + "px",
            top: y0 + r * (th + g) + "px",
            width: tw + "px",
            height: th + "px",
          });
          t.el.classList.toggle("small", tw < 130);
        });
      }
      function layoutAll() {
        for (const p of panels.values()) layout(p);
      }

      function setOwner(p, sid, actor, flash = true) {
        const t = p.tiles.get(sid);
        if (!t || !actor) return;
        p.owners.set(sid, actor);
        p.actors.set(actor.id, actor);
        t.cur.style.setProperty("--c", actor.color);
        t.el.style.setProperty("--c", actor.color);
        t.tag.textContent = actor.label;
        if (flash) glow(t, actor.color);
        renderDots(p);
      }

      function glow(t, color) {
        t.el.style.boxShadow = `0 0 0 1.5px ${color}, 0 0 22px -4px ${color}`;
        clearTimeout(t.glowT);
        t.glowT = setTimeout(() => (t.el.style.boxShadow = ""), 450);
      }

      function renderDots(p) {
        const d = $(".dots", p.el);
        const owners = new Map();
        for (const a of p.owners.values()) owners.set(a.id, a);
        const list = [...owners.values()];
        const key = list.map((a) => a.id).join(",");
        if (d.dataset.key !== key) {
          d.dataset.key = key;
          d.innerHTML = `<em>${list.length === 1 ? "1 个 Agent" : list.length + " 个 Agent"}</em>`;
          for (const a of list) {
            const s = h("span");
            s.dataset.id = a.id;
            s.title = a.label;
            s.style.background = a.color;
            d.append(s);
          }
        }
        const t = now();
        for (const s of d.querySelectorAll("span")) {
          const on =
            t - (p.seen.get(s.dataset.id) || -1e15) < 10000 && !p.finished;
          s.classList.toggle("on", on);
          s.style.boxShadow = on ? `0 0 8px ${s.style.background}` : "";
        }
      }

      function showFrame(t, src) {
        // Swap only after decode so tiles never flash empty.
        t.next = src;
        if (t.loading) return;
        t.loading = true;
        const img = new Image();
        img.onload = img.onerror = () => {
          t.loading = false;
          if (img.naturalWidth) {
            t.img.src = img.src;
            t.img.style.display = "";
            t.el.querySelector(".ph")?.remove();
          }
          if (t.next !== img.src && t.next) showFrame(t, t.next);
        };
        img.src = src;
        t.next = src;
      }

      function cursor(p, ev) {
        const t = p.tiles.get(ev.surface);
        if (!t) return;
        if (ev.actor) {
          const cur = p.owners.get(ev.surface);
          if (!cur || cur.id !== ev.actor.id) setOwner(p, ev.surface, ev.actor);
          if (!ev.quiet) p.seen.set(ev.actor.id, ev.t);
        }
        t.queue.push(ev);
        if (t.queue.length > 8) t.queue.splice(0, t.queue.length - 8);
        pump(t);
      }

      function pump(t) {
        if (t.busy) return;
        const ev = t.queue.shift();
        if (!ev) return;
        t.busy = true;
        const step = t.queue.length > 3 ? 160 : 340;
        t.cur.classList.add("on");
        t.cur.classList.toggle("flip", ev.x / t.vw > 0.72);
        t.cur.style.left = (ev.x / t.vw) * 100 + "%";
        t.cur.style.top = (ev.y / t.vh) * 100 + "%";
        if (ev.kind === "click") {
          setTimeout(() => {
            t.cur.classList.add("press");
            const r = h("div", "ripple");
            r.style.setProperty("--c", t.cur.style.getPropertyValue("--c"));
            r.style.left = (ev.x / t.vw) * 100 + "%";
            r.style.top = (ev.y / t.vh) * 100 + "%";
            t.el.append(r);
            setTimeout(() => r.remove(), 700);
            setTimeout(() => t.cur.classList.remove("press"), 130);
            glow(t, t.cur.style.getPropertyValue("--c"));
          }, step * 0.8);
        } else if (ev.kind === "type" || ev.kind === "key") {
          t.bubble.textContent =
            (ev.kind === "type" ? "⌨ " : "⌘ ") + (ev.text || "");
          t.bubble.classList.add("show");
          clearTimeout(t.bubbleT);
          t.bubbleT = setTimeout(() => t.bubble.classList.remove("show"), 1300);
          glow(t, t.cur.style.getPropertyValue("--c"));
        }
        setTimeout(() => {
          t.busy = false;
          pump(t);
        }, step);
      }

      function markFinished(p, at) {
        p.finished = at;
        p.el.classList.add("finished");
        $(".state span", p.el).textContent = "已结束";
        for (const t of p.tiles.values()) t.cur.classList.remove("on");
      }

      function setDone(p, sid, count) {
        const t = p.tiles.get(sid);
        if (!t) return;
        p.done.set(sid, count);
        t.el.classList.toggle("done", count > 0);
        $(".ok", t.el).textContent =
          count > 1 ? `✓ 已提交 ×${count}` : "✓ 完成";
      }

      function handle(ev, frameSrc) {
        if (ev.type === "hello") {
          offset = ev.now - Date.now();
          if (ev.out) $("#src").textContent = ev.out;
          return;
        }
        let p = panels.get(ev.panel);
        if (ev.type === "panel") {
          if (!p) p = makePanel(ev);
          else {
            for (const [sid, a] of Object.entries(ev.owners || {}))
              setOwner(p, sid, a, false);
            if (ev.finished) markFinished(p, ev.finished);
          }
          return;
        }
        if (!p) return;
        switch (ev.type) {
          case "frame":
            showFrame(
              p.tiles.get(ev.surface) || {},
              frameSrc ? frameSrc(ev) : "data:image/jpeg;base64," + ev.data,
            );
            break;
          case "cursor":
            cursor(p, ev);
            break;
          case "owner":
            setOwner(p, ev.surface, ev.actor);
            break;
          case "activity":
            p.seen.set(ev.actor.id, ev.t);
            if (!p.actors.has(ev.actor.id)) p.actors.set(ev.actor.id, ev.actor);
            break;
          case "done":
            setDone(p, ev.surface, ev.count);
            break;
          case "stats":
            p.tokens = ev.tokens;
            break;
          case "finished":
            markFinished(p, ev.finished);
            break;
        }
      }

      function tick() {
        const t = now();
        $("#clock").textContent = new Date(t).toLocaleTimeString("zh-CN", {
          hour12: false,
        });
        for (const p of panels.values()) {
          let active = 0;
          if (!p.finished)
            for (const v of p.seen.values()) if (t - v < 10000) active++;
          const v = (k) => $(`[data-k="${k}"]`, p.el);
          v("active").textContent = active;
          const done = [...p.done.values()].filter((c) => c > 0).length;
          v("done").innerHTML = `${done}<small> / ${p.tiles.size}</small>`;
          $(".bar i", p.el).style.width = (done / p.tiles.size) * 100 + "%";
          v("time").textContent = fmtDur((p.finished || t) - p.started);
          v("tok").textContent = fmtTok(p.tokens);
          renderDots(p);
        }
      }
      setInterval(tick, 250);
      addEventListener("resize", layoutAll);

      // ------------------------------------------------------------ live
      function live() {
        const es = new EventSource("/events");
        es.onmessage = (m) => handle(JSON.parse(m.data));
        es.onerror = () => $("#mode").classList.add("off");
        es.onopen = () => $("#mode").classList.remove("off");
      }

      // ------------------------------------------------------------ replay
      async function replay() {
        const mode = $("#mode");
        mode.classList.add("replay");
        $("span", mode).textContent = `回放 ×${SPEED}`;
        $("#src").textContent = REPLAY;
        const data = await (
          await fetch("/replay-data?dir=" + encodeURIComponent(REPLAY))
        ).json();
        const all = [];
        for (const arm of data.arms)
          for (const ev of arm.events)
            all.push({ ...ev, panel: ev.panel || arm.panel });
        if (!all.length) {
          $("#empty").innerHTML =
            "<h1>没有可回放的录制</h1><div>用 --record 运行实况墙后，结束的实验会写出 wall-recording/。</div>";
          return;
        }
        all.sort((a, b) => a.t - b.t);
        const t0 = all[0].t,
          tEnd = all[all.length - 1].t;
        const src = (ev) =>
          `/replay-file?dir=${encodeURIComponent(data.dir)}&panel=${encodeURIComponent(ev.panel)}&file=${encodeURIComponent(ev.file)}`;
        let start = performance.now(),
          i = 0;
        vclock = () => Math.min(tEnd, t0 + (performance.now() - start) * SPEED);
        // No preloading: each tile loads only its newest frame (latest wins).
        const step = () => {
          const v = vclock();
          while (i < all.length && all[i].t <= v) handle(all[i++], src);
          if (i < all.length) requestAnimationFrame(step);
          else {
            $("span", mode).textContent = "回放结束";
            mode.classList.add("off");
            const b = h("button", "ctl", "重新播放");
            b.onclick = () => location.reload();
            $("#ctl").replaceChildren(b);
          }
        };
        requestAnimationFrame(step);
      }

      REPLAY ? replay() : live();
    </script>
  </body>
</html>
